<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF6FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- thermometer body -->
  <g transform="translate(256 256)">
    <rect x="-46" y="-150" width="92" height="250" rx="46" fill="#FFFFFF" stroke="#1F2A44" stroke-width="14"/>
    <circle cx="0" cy="118" r="66" fill="#FFFFFF" stroke="#1F2A44" stroke-width="14"/>
    <!-- mercury column (negative, blue) -->
    <rect x="-26" y="-20" width="52" height="138" rx="26" fill="#1E6FD9"/>
    <circle cx="0" cy="118" r="44" fill="#1E6FD9"/>
    <!-- scale ticks -->
    <g stroke="#1F2A44" stroke-width="8" stroke-linecap="round">
      <line x1="46" y1="-120" x2="64" y2="-120"/>
      <line x1="46" y1="-70" x2="64" y2="-70"/>
      <line x1="46" y1="-20" x2="64" y2="-20"/>
      <line x1="46" y1="30" x2="64" y2="30"/>
      <line x1="46" y1="80" x2="64" y2="80"/>
    </g>
    <!-- mascot face -->
    <circle cx="-16" cy="-60" r="8" fill="#1F2A44"/>
    <circle cx="16" cy="-60" r="8" fill="#1F2A44"/>
    <path d="M -18 -30 Q 0 -10 18 -30" stroke="#1F2A44" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
